name: release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meson.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: meson
        run: |
          version=$(sed -n "/version[[:space:]]*:/ { s/.*version[[:space:]]*:[[:space:]]*'\([^']*\)'.*/\1/p; q; }" meson.build)
          if [ -z "$version" ]; then
            echo "unable to read the project version from meson.build" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "meson.build version: $version"

      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.meson.outputs.version }}"
          case "$version" in
            "$tag"|"$tag".*) ;;
            *)
              echo "tag $GITHUB_REF_NAME does not match meson.build version $version" >&2
              exit 1
              ;;
          esac

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64-linux
          - runner: ubuntu-24.04-arm
            arch: arm64-linux
          - runner: macos-15
            arch: arm64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install build dependencies
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            brew install vala meson ninja zstd glib pkg-config fakeroot
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              valac ninja-build zstd fakeroot pkg-config \
              libglib2.0-dev libglib2.0-dev-bin git make pipx
            pipx install meson
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Run supravim.dev build script
        run: |
          curl -fsSL https://supravim.dev/macos -o build.sh
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log
          build_dir=$(grep -m1 'Created temporary directory:' build.log | sed 's/^.*: //')
          if [ -z "$build_dir" ] || [ ! -d "$build_dir" ]; then
            echo "could not determine the build directory from build.log" >&2
            exit 1
          fi
          echo "BUILD_DIR=$build_dir" >> "$GITHUB_ENV"

      - name: Collect the packages
        run: |
          mkdir -p dist
          found=0
          for pkg in "$BUILD_DIR"/*.suprapack; do
            [ -e "$pkg" ] || continue
            mv "$pkg" dist/
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "no .suprapack was produced for ${{ matrix.arch }}" >&2
            exit 1
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: suprapack-${{ matrix.arch }}
          path: dist/*.suprapack
          if-no-files-found: error

  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: suprapack-*
          merge-multiple: true

      - run: ls -lh dist/

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SupraVim ${{ needs.version.outputs.version }}" \
            --generate-notes \
            dist/*.suprapack
